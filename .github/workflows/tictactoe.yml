name: Play Tic-Tac-Toe

on:
  issues:
    types: [opened]

jobs:
  play:
    runs-on: ubuntu-latest
    if: startsWith(github.event.issue.title, 'ttt|')
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Tic-Tac-Toe Move
        run: |
          python scripts/tictactoe.py "${{ github.event.issue.title }}" "${{ github.event.issue.user.login }}"

      - name: Commit and Push README changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "game: tic-tac-toe move by @${{ github.event.issue.user.login }} [skip ci]" || exit 0
          git push

      - name: Reply and Close Issue
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '✅ **Nước cờ đã được ghi nhận!** Bàn cờ Tic-Tac-Toe trên trang profile cá nhân của @${{ github.repository_owner }} đã được cập nhật. Cảm ơn bạn đã tham gia chơi!'
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            });

